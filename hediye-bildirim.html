.streamer { display:flex; align-items:center; gap:10px; }
.streamer img { width:40px; height:40px; border-radius:50%; border:2px solid #fff; object-fit:cover; }
.streamer-info strong { display:block; font-size:14px; }
.streamer-info span { color:#aaa; font-size:12px; }

  position:absolute;
  top:100px;

}
.notifications::-webkit-scrollbar { display:none; }
.notif {
  background:rgba(28,28,30,0.88);
  backdrop-filter:blur(8px);
  border-radius:12px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  animation:slideDown 0.35s ease-out;
  border:1px solid rgba(255,255,255,0.06);
}

.notif.medium img { width:48px; height:48px; }
.notif.big { min-height:144px; padding:12px 14px; background:rgba(40,40,45,0.95); }

.notif.legendary { min-height:320px; padding:20px 22px; background:rgba(60,60,70,0.98); }

.notif.follow { background:rgba(0,200,100,0.15); border-color:rgba(0,200,100,0.35); }
@keyframes slideDown {
  from { transform:translateY(-40px); opacity:0; }
  to { transform:translateY(0); opacity:1; }
}
.notif img { width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.notif-text { flex:1; min-width:0; }
.notif-text strong { font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif-text span { font-size:11px; color:#bbb; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gift-icon { font-size:18px; flex-shrink:0; }
.notif.big .gift-icon, .notif.xlarge .gift-icon, .notif.legendary .gift-icon { font-size:28px; }
.controls {

  bottom:16px;
  left:50%;

  display:flex;
  gap:6px;
  z-index:50;
  flex-wrap:wrap;
  justify-content:center;
  width:92%;
}

  color:#fff;
  border:none;
  padding:8px 10px;
  border-radius:10px;
  font-size:11px;
  cursor:pointer;
}

<script>
const names = ["Alex","Maya","Noah","Sophie","Jay","Emma","Zoe","Liam","Ava","Omar","Elena","Kai","Nora","Leo","Mia"];
const photos = [
  "https://randomuser.me/api/portraits/men/32.jpg",
  "https://randomuser.me/api/portraits/women/68.jpg",
  "https://randomuser.me/api/portraits/men/45.jpg",
  "https://randomuser.me/api/portraits/women/22.jpg",
  "https://randomuser.me/api/portraits/men/12.jpg",
  "https://randomuser.me/api/portraits/women/33.jpg",
  "https://randomuser.me/api/portraits/women/55.jpg",
  "https://randomuser.me/api/portraits/men/67.jpg",
  "https://randomuser.me/api/portraits/women/41.jpg",
  "https://randomuser.me/api/portraits/men/28.jpg",
  "https://randomuser.me/api/portraits/women/19.jpg",
  "https://randomuser.me/api/portraits/men/53.jpg",
  "https://randomuser.me/api/portraits/women/27.jpg",
  "https://randomuser.me/api/portraits/men/71.jpg",
  "https://randomuser.me/api/portraits/women/60.jpg"
];
const usernames = ["@alex_live","@maya.v","@noahx","@sophie.official","@jay.codes","@emma.rose","@zoe.art","@liam.music","@ava.studio","@omar.tr","@elena.design","@kai.beats","@nora.film","@leo.photo","@mia.dance"];

const container = document.getElementById("notifications");
let featured = null;
let featuredTimer = null;

function getTier(coins) {
  if (coins >= 10000) return { cls:"legendary", duration:8000, icon:"👑" };
  if (coins >= 2000)  return { cls:"xlarge", duration:6000, icon:"💎" };
  if (coins >= 500)   return { cls:"big", duration:5000, icon:"💎" };
  if (coins >= 100)   return { cls:"medium", duration:3000, icon:"🌹" };
  return { cls:"", duration:0, icon:"🎁" };
}


function playSound(tier) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    function tone(freq, start, dur, type, vol) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(vol, now + start);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + dur + 0.05);
    }

    // All sounds are louder and multi-tone
    if (tier === "legendary") {
      tone(523, 0, 0.15, "triangle", 0.45);
      tone(659, 0.12, 0.15, "triangle", 0.45);
      tone(784, 0.24, 0.2, "square", 0.5);
      tone(1046, 0.4, 0.3, "sine", 0.48);
    } else if (tier === "xlarge") {
      tone(440, 0, 0.14, "square", 0.4);
      tone(554, 0.1, 0.14, "square", 0.4);
      tone(659, 0.2, 0.2, "triangle", 0.42);
    } else if (tier === "big") {
      tone(392, 0, 0.14, "triangle", 0.38);
      tone(523, 0.12, 0.18, "sine", 0.4);
      tone(659, 0.26, 0.16, "triangle", 0.38);
    } else if (tier === "medium") {
      tone(349, 0, 0.15, "sine", 0.35);
      tone(440, 0.12, 0.15, "triangle", 0.35);
      tone(523, 0.24, 0.12, "sine", 0.32);
    } else if (tier === "follow") {
      tone(600, 0, 0.12, "triangle", 0.35);
      tone(800, 0.1, 0.14, "sine", 0.35);
      tone(1000, 0.22, 0.12, "triangle", 0.32);
    } else {
      // small
      tone(320, 0, 0.14, "sine", 0.32);
      tone(400, 0.12, 0.14, "triangle", 0.32);
    }
  } catch(e) {}
}

function createNotif(coins = 50, isFollow = false) {
  const idx = Math.floor(Math.random() * names.length);
  const notif = document.createElement("div");
  const tier = isFollow ? { cls:"follow", duration:0, icon:"➕" } : getTier(coins);

  notif.className = "notif" + (tier.cls ? " " + tier.cls : "");
  notif.innerHTML = `
    <img src="${photos[idx]}" alt="">
    <div class="notif-text">
      <strong>${names[idx]}</strong>
      <span>${usernames[idx]}</span>
    </div>
    <div class="gift-icon">${tier.icon}</div>
  `;

  if (tier.duration > 0) {
    setTimeout(() => {
      if (notif.parentNode) notif.classList.remove("medium","big","xlarge","legendary");
    }, tier.duration);
  }

  if (tier.duration > 0) {
    featured = notif;
    container.prepend(notif);
    if (featuredTimer) clearTimeout(featuredTimer);
    featuredTimer = setTimeout(() => { featured = null; }, tier.duration);
  } else if (featured && featured.parentNode) {
    featured.after(notif);
  } else {
    container.prepend(notif);
  }
  container.scrollTop = 0;
  playSound(tier.cls || (isFollow ? 'follow' : ''));
}

function sendGift(coins) { createNotif(coins); }
function sendFollow() { createNotif(0, true); }
function clearAll() {
  container.innerHTML = "";
  featured = null;
  if (featuredTimer) clearTimeout(featuredTimer);
}

// Tikfinity / OBS / TikTok Live Studio gift listener
window.addEventListener("message", function(e) {
  try {
    const d = e.data || {};
    const coins = d.coins || d.diamondCount || d.gift?.coins || d.gift?.diamondCount || 0;
    if (d.type === "gift" || d.event === "gift" || d.gift || coins > 0) {
      createNotif(Number(coins) || 1);
    }
    if (d.type === "follow" || d.event === "follow" || d.follow) {
      createNotif(0, true);
    }
  } catch(err) {}
});
</script>
